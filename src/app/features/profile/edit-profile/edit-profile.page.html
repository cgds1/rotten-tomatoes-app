<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancel()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="font-display">Editar perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="save()" class="edit-form">
    <!-- Name field -->
    <div class="form-field">
      <ion-label class="field-label font-body">Nombre</ion-label>
      <ion-input
        formControlName="name"
        type="text"
        placeholder="Tu nombre"
        class="field-input"
        [class.field-input--error]="nameControl.touched && nameControl.invalid"
      ></ion-input>
      <span
        class="field-error font-body"
        *ngIf="nameControl.touched && nameControl.hasError('required')"
      >
        El nombre es obligatorio
      </span>
      <span
        class="field-error font-body"
        *ngIf="nameControl.touched && nameControl.hasError('minlength')"
      >
        El nombre debe tener al menos 2 caracteres
      </span>
    </div>

    <!-- Email field (read-only) -->
    <div class="form-field">
      <ion-label class="field-label font-body">Email</ion-label>
      <ion-input
        formControlName="email"
        type="email"
        class="field-input field-input--disabled"
      ></ion-input>
      <span class="field-hint font-body">El email no se puede modificar</span>
    </div>

    <!-- Save button -->
    <ion-button
      expand="block"
      type="submit"
      class="save-btn"
      [disabled]="form.invalid || saving"
    >
      <ion-spinner *ngIf="saving" name="crescent" slot="start"></ion-spinner>
      {{ saving ? 'Guardando...' : 'Guardar cambios' }}
    </ion-button>
  </form>
</ion-content>
