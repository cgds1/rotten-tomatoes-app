<ion-header>
  <ion-toolbar>
    <ion-title class="font-display">Buscar</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      mode="ios"
      placeholder="Buscar películas por título..."
      [value]="query"
      (ionInput)="onSearchChange($event)"
      (ionChange)="onSearch()"
      [debounce]="0"
      animated
      autofocus="true"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Recent searches (shown when no query) -->
  <div *ngIf="!query && recentSearches.length > 0" class="recent-searches">
    <p class="section-label font-body">Búsquedas recientes</p>
    <div class="recent-chips">
      <ion-chip *ngFor="let term of recentSearches" (click)="searchFromRecent(term)">
        <ion-icon name="time-outline"></ion-icon>
        <ion-label>{{ term }}</ion-label>
        <ion-icon name="close-circle" (click)="removeRecent(term, $event)"></ion-icon>
      </ion-chip>
    </div>
  </div>

  <!-- Empty initial state -->
  <app-empty-state
    *ngIf="!query && recentSearches.length === 0"
    icon="search-outline"
    title="Buscá películas"
    subtitle="Escribí el título de una película para encontrarla"
  ></app-empty-state>

  <!-- Loading -->
  <div *ngIf="loading" class="search-loading">
    <ion-grid>
      <ion-row>
        <ion-col size="12" *ngFor="let i of [1,2,3]">
          <div class="skeleton-search-result">
            <div class="skeleton-search-poster skeleton-shimmer"></div>
            <div class="skeleton-search-info">
              <div class="skeleton-search-title skeleton-shimmer"></div>
              <div class="skeleton-search-year skeleton-shimmer"></div>
              <div class="skeleton-search-ratings">
                <div class="skeleton-search-badge skeleton-shimmer"></div>
                <div class="skeleton-search-badge skeleton-shimmer"></div>
              </div>
            </div>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <!-- Error state -->
  <app-error-state
    *ngIf="searched && !loading && error"
    [message]="error"
    (retry)="retrySearch()"
  ></app-error-state>

  <!-- Results list -->
  <ion-list *ngIf="searched && !loading && !error && results.length > 0" lines="none">
    <ion-item *ngFor="let movie of results" (click)="openMovie(movie)" button detail="false">
      <div class="search-result">
        <img [src]="movie.posterUrl" [alt]="movie.title" class="result-poster" loading="lazy" />
        <div class="result-info">
          <h3 class="result-title font-display">{{ movie.title }}</h3>
          <span class="result-year font-body">{{ getYear(movie) }}</span>
          <div class="result-ratings">
            <app-rating-badge type="user" [value]="movie.userRating"></app-rating-badge>
            <app-rating-badge type="critic" [value]="movie.criticRating"></app-rating-badge>
          </div>
        </div>
      </div>
    </ion-item>
  </ion-list>

  <!-- No results -->
  <app-empty-state
    *ngIf="searched && !loading && !error && results.length === 0"
    icon="sad-outline"
    title="Sin resultados"
    [subtitle]="'No se encontraron resultados para &quot;' + query + '&quot;'"
  ></app-empty-state>
</ion-content>
