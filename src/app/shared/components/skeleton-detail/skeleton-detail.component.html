<div class="skeleton-detail">
  <!-- Backdrop -->
  <div class="skeleton-backdrop skeleton-shimmer"></div>

  <div class="skeleton-detail__content">
    <!-- Title -->
    <div class="skeleton-detail__title skeleton-shimmer"></div>

    <!-- Ratings -->
    <div class="skeleton-detail__ratings">
      <div class="skeleton-detail__rating-card skeleton-shimmer"></div>
      <div class="skeleton-detail__rating-card skeleton-shimmer"></div>
    </div>

    <!-- Info row -->
    <div class="skeleton-detail__info-row">
      <div class="skeleton-detail__info-item skeleton-shimmer"></div>
      <div class="skeleton-detail__info-item skeleton-shimmer"></div>
      <div class="skeleton-detail__info-chip skeleton-shimmer"></div>
      <div class="skeleton-detail__info-chip skeleton-shimmer"></div>
    </div>

    <!-- Synopsis -->
    <div class="skeleton-detail__synopsis">
      <div class="skeleton-detail__line skeleton-shimmer" style="width: 100%"></div>
      <div class="skeleton-detail__line skeleton-shimmer" style="width: 95%"></div>
      <div class="skeleton-detail__line skeleton-shimmer" style="width: 80%"></div>
      <div class="skeleton-detail__line skeleton-shimmer" style="width: 60%"></div>
    </div>

    <!-- Cast -->
    <div class="skeleton-detail__cast">
      <div class="skeleton-detail__section-title skeleton-shimmer"></div>
      <div class="skeleton-detail__cast-scroll">
        <div class="skeleton-detail__cast-item" *ngFor="let i of [1,2,3,4,5]">
          <div class="skeleton-detail__cast-photo skeleton-shimmer"></div>
          <div class="skeleton-detail__cast-name skeleton-shimmer"></div>
          <div class="skeleton-detail__cast-role skeleton-shimmer"></div>
        </div>
      </div>
    </div>
  </div>
</div>
