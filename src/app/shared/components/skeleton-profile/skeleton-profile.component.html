<div class="skeleton-profile">
  <!-- Avatar -->
  <div class="skeleton-profile__avatar skeleton-shimmer"></div>

  <!-- Name + email -->
  <div class="skeleton-profile__name skeleton-shimmer"></div>
  <div class="skeleton-profile__email skeleton-shimmer"></div>
  <div class="skeleton-profile__badge skeleton-shimmer"></div>

  <!-- Stats -->
  <div class="skeleton-profile__stats">
    <div class="skeleton-profile__stat skeleton-shimmer"></div>
    <div class="skeleton-profile__stat skeleton-shimmer"></div>
  </div>

  <!-- Reviews list -->
  <div class="skeleton-profile__section-title skeleton-shimmer"></div>
  <div class="skeleton-profile__review" *ngFor="let i of [1,2,3]">
    <div class="skeleton-profile__review-poster skeleton-shimmer"></div>
    <div class="skeleton-profile__review-info">
      <div class="skeleton-profile__review-title skeleton-shimmer"></div>
      <div class="skeleton-profile__review-score skeleton-shimmer"></div>
    </div>
  </div>
</div>
